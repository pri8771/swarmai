version: 1
epics: [E10, E11, E12]
packets:
- {id: A-1001, epic: E10, goal: "Define versioned SwarmTemplate contract.", inputs: [src/swarm/contracts/mission_v2.py, src/swarm/contracts/inference_v2.py, src/swarm/contracts/tool_v2.py], outputs: [src/swarm/contracts/template_v2.py, tests/contracts/test_template_v2.py], steps: ["Define starting population tendencies, capability requirements, inference profiles, defaults, completion evidence and overrideable fields."], test: "uv run pytest tests/contracts/test_template_v2.py -q", acceptance: "Template contains capability requirements rather than mandatory vendor ids.", deps: [A-0110]}
- {id: A-1002, epic: E10, goal: "Implement template load/copy/version service.", inputs: [A-1001], outputs: [src/swarm/product/template_service_v2.py, tests/product/test_template_service_v2.py], steps: ["Load immutable version; copy to user-owned config; edit copy; retain source/version provenance."], test: "uv run pytest tests/product/test_template_service_v2.py -q", acceptance: "Editing copy never mutates source template/version.", deps: [A-1001]}
- {id: A-1003, epic: E10, goal: "Create blank swarm template.", inputs: [A-1001], outputs: [config/templates/blank_v2.yaml, tests/product/test_blank_template_v2.py], steps: ["Minimal starting population and no domain-specific assumptions; declare only core mission requirements."], test: "uv run pytest tests/product/test_blank_template_v2.py -q", acceptance: "Template validates and has no provider lock-in.", deps: [A-1001]}
- {id: A-1004, epic: E10, goal: "Create software-engineering template.", inputs: [A-1001], outputs: [config/templates/software_engineering_v2.yaml, tests/product/test_software_template_v2.py], steps: ["Declare source-control/terminal/testing capabilities, planning/build/verification tendencies, artifact completion evidence."], test: "uv run pytest tests/product/test_software_template_v2.py -q", acceptance: "No fixed final agent count and no hard-coded provider.", deps: [A-1001]}
- {id: A-1005, epic: E10, goal: "Create research template.", inputs: [A-1001], outputs: [config/templates/research_v2.yaml, tests/product/test_research_template_v2.py], steps: ["Declare web/source capabilities, independent research/synthesis/verification tendencies, citation evidence."], test: "uv run pytest tests/product/test_research_template_v2.py -q", acceptance: "Template validates without mandatory vendor.", deps: [A-1001]}
- {id: A-1006, epic: E10, goal: "Create experiment-lab template.", inputs: [A-1001, A-0806], outputs: [config/templates/experiment_lab_v2.yaml, tests/product/test_experiment_template_v2.py], steps: ["Enable Experimenter tendency, attempt evidence, parallel independent hypotheses within envelope."], test: "uv run pytest tests/product/test_experiment_template_v2.py -q", acceptance: "Success requires verification, not attempt count.", deps: [A-1001, A-0806]}
- {id: A-1007, epic: E10, goal: "Create IT-operations template.", inputs: [A-1001], outputs: [config/templates/it_operations_v2.yaml, tests/product/test_it_template_v2.py], steps: ["Declare diagnostics/terminal/web capabilities and evidence-first remediation tendencies; keep consequential actions capability-gated."], test: "uv run pytest tests/product/test_it_template_v2.py -q", acceptance: "Template validates and separates diagnosis from granted change capability.", deps: [A-1001]}

- {id: A-1101, epic: E11, goal: "Add API to create mission from goal plus template/config.", inputs: [A-0506, A-1002], outputs: [src/swarm/api/missions_v2.py, tests/api/test_create_mission_v2.py], steps: ["Accept goal/template/resource/capability/inference config; persist mission; enqueue planning; return mission id."], test: "uv run pytest tests/api/test_create_mission_v2.py -q", acceptance: "Created mission is durable before planning starts.", deps: [A-0506, A-1002]}
- {id: A-1102, epic: E11, goal: "Add API for mission overview and progress.", inputs: [A-1101, A-0904], outputs: [src/swarm/api/mission_status_v2.py, tests/api/test_mission_status_v2.py], steps: ["Return phase, verified progress, blockers, active/dormant agents, resource usage, pending decisions."], test: "uv run pytest tests/api/test_mission_status_v2.py -q", acceptance: "Status derives from durable state, not worker memory.", deps: [A-1101, A-0904]}
- {id: A-1103, epic: E11, goal: "Add pause/resume/stop mission controls.", inputs: [A-1101], outputs: [src/swarm/api/mission_control_v2.py, tests/api/test_mission_control_v2.py], steps: ["Persist requested control; stop new work acquisition; propagate cancellation/pause to active work according to existing runtime semantics."], test: "uv run pytest tests/api/test_mission_control_v2.py -q", acceptance: "Paused mission cannot lease new artifact; stopped state survives restart.", deps: [A-1101]}
- {id: A-1104, epic: E11, goal: "Add minimal web mission-start screen.", inputs: [A-1101, apps/console, docs/redesign/reuse/path_conventions.yaml], outputs: ["console_component_path_key:mission_start_v2", tests/ui/test_mission_start_v2.py], steps: ["Goal field; template selector; inference selector; capability/resource summary; start action. Follow existing console framework discovered in E00."], test: "Run focused console test command discovered in E00 plus tests/ui/test_mission_start_v2.py if Python harness applies.", acceptance: "User can create mission without configuring individual agents.", deps: [A-1101, A-0006]}
- {id: A-1105, epic: E11, goal: "Add minimal web mission overview screen.", inputs: [A-1102, apps/console, docs/redesign/reuse/path_conventions.yaml], outputs: ["console_component_path_key:mission_overview_v2", tests/ui/test_mission_overview_v2.py], steps: ["Render goal/phase/progress/blockers/team/resource/evidence summary; expose pause/stop."], test: "Run focused console test command discovered in E00.", acceptance: "Overview works after browser reload from API state.", deps: [A-1102, A-1103, A-0006]}
- {id: A-1106, epic: E11, goal: "Prove browser/process interruption journey.", inputs: [A-1104, A-1105, A-0206], outputs: [tests/e2e/test_cloud_journey_restart_v2.py], steps: ["Create mission; start work; recreate API/worker services; fetch overview; continue; complete fixture artifact."], test: "uv run pytest tests/e2e/test_cloud_journey_restart_v2.py -q", acceptance: "Mission continues/reloads without original browser or process memory.", deps: [A-1104, A-1105, A-0206]}

- {id: A-1201, epic: E12, goal: "Define SplitSignal adapter as optional implementation of portable inference protocol.", inputs: [A-0301, docs/redesign/reuse/inference_inventory.yaml], outputs: [src/swarm/providers/adapters/splitsignal_v2.py, tests/providers/test_splitsignal_v2.py], steps: ["Map portable request to configured SplitSignal endpoint; normalize resolved route/usage metadata when returned; tolerate optional metadata absence."], test: "uv run pytest tests/providers/test_splitsignal_v2.py -q", acceptance: "No SplitSignal field leaks into core Agent/Mission contracts.", deps: [A-0301]}
- {id: A-1202, epic: E12, goal: "Add inference connection configuration model/API.", inputs: [A-0303, A-1201], outputs: [src/swarm/api/inference_connections_v2.py, tests/api/test_inference_connections_v2.py], steps: ["Create/list/test connection metadata using secret references; support SplitSignal and OpenAI-compatible types."], test: "uv run pytest tests/api/test_inference_connections_v2.py -q", acceptance: "Secrets are not returned in API responses or receipts.", deps: [A-0303, A-1201]}
- {id: A-1203, epic: E12, goal: "Add capability probe for configured inference connection.", inputs: [A-1202], outputs: [src/swarm/providers/capability_probe_v2.py, tests/providers/test_capability_probe_v2.py], steps: ["Probe only supported safe metadata/test request; record supported/unsupported/unknown capabilities."], test: "uv run pytest tests/providers/test_capability_probe_v2.py -q", acceptance: "Unknown capability remains unknown, not assumed supported.", deps: [A-1202]}
- {id: A-1204, epic: E12, goal: "Prove same agent code runs through SplitSignal fake and BYO fake.", inputs: [A-1201, A-0303, A-1203], outputs: [tests/integration/test_inference_portability_v2.py], steps: ["Run identical fixture assignment through both adapters; compare normalized result contract; assert no agent-code branch."], test: "uv run pytest tests/integration/test_inference_portability_v2.py -q", acceptance: "Only connection/profile configuration changes.", deps: [A-1201, A-0303, A-1203]}
- {id: A-1205, epic: E12, goal: "Add live-gated portability evidence harness.", inputs: [A-1204], outputs: [tests/e2e/test_live_inference_portability_v2.py, docs/redesign/evidence/E12_LIVE_TEMPLATE.md], steps: ["Skip without explicit live credentials; when enabled run one minimal request per configured endpoint; record endpoint/model/usage/result without secrets."], test: "Run live-gated test only with explicit environment gate.", acceptance: "Offline CI never claims live proof; live run produces evidence template.", deps: [A-1204]}
