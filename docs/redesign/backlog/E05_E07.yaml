- {id: A-0502, epic: E05, goal: "Validate cycles and compute ready artifacts.", inputs: [A-0501], outputs: [src/swarm/mission/artifact_graph_validator.py, tests/mission/test_artifact_graph_validator.py], steps: ["Detect cycles; compute ready nodes from accepted dependencies; return deterministic errors."], test: "uv run pytest tests/mission/test_artifact_graph_validator.py -q", acceptance: "Cycle rejected; parallel-ready fixture exact.", deps: [A-0501]}
- {id: A-0503, epic: E05, goal: "Validate weak-model packet size.", inputs: [A-0501, docs/redesign/AI_NATIVE_ARTIFACT_PROTOCOL.md], outputs: [src/swarm/mission/packet_size_validator.py, tests/mission/test_packet_size_validator.py], steps: ["Reject missing exact outputs/tests, combined schema+API+UI, and open-ended research markers."], test: "uv run pytest tests/mission/test_packet_size_validator.py -q", acceptance: "Good XS/S pass; broad fixtures fail with reasons.", deps: [A-0501]}
- {id: A-0504, epic: E05, goal: "Build minimal packet context bundle.", inputs: [A-0501], outputs: [src/swarm/mission/context_bundle_v2.py, tests/mission/test_context_bundle_v2.py], steps: ["Bundle packet, direct contracts, listed inputs and focused tests; exclude unrelated history."], test: "uv run pytest tests/mission/test_context_bundle_v2.py -q", acceptance: "Allowlist included; unrelated fixture excluded.", deps: [A-0501]}
- {id: A-0505, epic: E05, goal: "Convert mission goal to candidate artifact graph.", inputs: [A-0304, A-0501, A-0502, A-0503], outputs: [src/swarm/mission/artifact_planner_v2.py, tests/mission/test_artifact_planner_v2.py], steps: ["Call planning inference profile; require structured graph; validate; request revision on invalid output."], test: "uv run pytest tests/mission/test_artifact_planner_v2.py -q", acceptance: "Invalid plan cannot enter execution.", deps: [A-0304, A-0502, A-0503]}
- {id: A-0506, epic: E05, goal: "Persist versioned artifact graph and readiness.", inputs: [A-0205, A-0502, A-0505], outputs: [src/swarm/mission/artifact_graph_store.py, tests/integration/test_artifact_graph_store.py], steps: ["Persist graph version/nodes/edges; expose ready nodes; preserve prior version on replan."], test: "uv run pytest tests/integration/test_artifact_graph_store.py -q", acceptance: "Reloaded graph has same ready set.", deps: [A-0205, A-0502, A-0505]}

- {id: A-0601, epic: E06, goal: "Define recruitment request and spawn result.", inputs: [src/swarm/contracts/agent_v2.py, src/swarm/contracts/artifact_v2.py], outputs: [src/swarm/contracts/recruitment_v2.py, tests/contracts/test_recruitment_v2.py], steps: ["Define reason/subgoal/capabilities/suggested profile/parent artifact and reuse/spawn result."], test: "uv run pytest tests/contracts/test_recruitment_v2.py -q", acceptance: "Request grants no resources/permissions itself.", deps: [A-0110]}
- {id: A-0602, epic: E06, goal: "Match suitable idle agent before spawning.", inputs: [A-0202, A-0601], outputs: [src/swarm/runtime/agent_matcher_v2.py, tests/runtime/test_agent_matcher_v2.py], steps: ["Filter by capability and mission access; rank deterministically; return none when no fit."], test: "uv run pytest tests/runtime/test_agent_matcher_v2.py -q", acceptance: "Suitable idle agent is reused.", deps: [A-0202, A-0601]}
- {id: A-0603, epic: E06, goal: "Spawn agent within mission resources.", inputs: [A-0601, A-0602, src/swarm/contracts/mission_v2.py], outputs: [src/swarm/runtime/agent_spawn_v2.py, tests/runtime/test_agent_spawn_v2.py], steps: ["Check envelope; create identity only if no match; record lineage; use idempotency key."], test: "uv run pytest tests/runtime/test_agent_spawn_v2.py -q", acceptance: "Over-limit denied; retry does not duplicate identity.", deps: [A-0602]}
- {id: A-0604, epic: E06, goal: "Create/join/leave/dissolve crews.", inputs: [A-0204], outputs: [src/swarm/runtime/crew_service_v2.py, tests/runtime/test_crew_service_v2.py], steps: ["Persist each membership event; keep agent identity after dissolution."], test: "uv run pytest tests/runtime/test_crew_service_v2.py -q", acceptance: "Crew dissolution never deletes agent.", deps: [A-0204]}
- {id: A-0605, epic: E06, goal: "Assign and reassign ready artifacts.", inputs: [A-0205, A-0602, A-0603], outputs: [src/swarm/runtime/artifact_assignment_v2.py, tests/runtime/test_artifact_assignment_v2.py], steps: ["Assign ready artifact; release/reassign explicitly; prevent two active exclusive owners."], test: "uv run pytest tests/runtime/test_artifact_assignment_v2.py -q", acceptance: "Exclusive artifact has <=1 active owner.", deps: [A-0205, A-0602, A-0603]}
- {id: A-0606, epic: E06, goal: "Prove autonomous fixture reorganization.", inputs: [A-0506, A-0603, A-0604, A-0605], outputs: [tests/e2e/test_autonomous_population_fixture.py], steps: ["Start small population; expose independent artifacts; recruit; form crew; complete; dissolve; verify history."], test: "uv run pytest tests/e2e/test_autonomous_population_fixture.py -q", acceptance: "No hard-coded final worker count or mandatory crew hierarchy.", deps: [A-0506, A-0603, A-0604, A-0605]}

- {id: A-0701, epic: E07, goal: "Persist immutable raw memory events.", inputs: [src/swarm/contracts/memory_v2.py], outputs: [src/swarm/memory/raw_store_v2.py, tests/memory/test_raw_store_v2.py], steps: ["Append raw node with provenance/tags; retrieve by id."], test: "uv run pytest tests/memory/test_raw_store_v2.py -q", acceptance: "Content/provenance round-trip unchanged.", deps: [A-0206]}
- {id: A-0702, epic: E07, goal: "Persist long-term knowledge graph nodes/relations.", inputs: [A-0701], outputs: [src/swarm/memory/knowledge_graph_v2.py, tests/memory/test_knowledge_graph_v2.py], steps: ["Create node; link evidence; add typed relation; traverse one hop."], test: "uv run pytest tests/memory/test_knowledge_graph_v2.py -q", acceptance: "Knowledge exposes provenance refs.", deps: [A-0701]}
- {id: A-0703, epic: E07, goal: "Implement compact medium-memory pointer index.", inputs: [A-0702], outputs: [src/swarm/memory/pointer_index_v2.py, tests/memory/test_pointer_index_v2.py], steps: ["Store topic/summary/tags/target refs; search pointers; return refs not full payload."], test: "uv run pytest tests/memory/test_pointer_index_v2.py -q", acceptance: "Pointer result smaller than referenced payload fixture.", deps: [A-0702]}
- {id: A-0704, epic: E07, goal: "Persist current task-state memory.", inputs: [src/swarm/contracts/artifact_v2.py, src/swarm/contracts/execution_v2.py], outputs: [src/swarm/memory/task_state_v2.py, tests/memory/test_task_state_v2.py], steps: ["Store commitments/blockers/active artifact refs/checkpoint atomically."], test: "uv run pytest tests/memory/test_task_state_v2.py -q", acceptance: "Task state reloads after new session.", deps: [A-0206]}
- {id: A-0705, epic: E07, goal: "Assemble bounded working context.", inputs: [A-0703, A-0704], outputs: [src/swarm/memory/context_assembler_v2.py, tests/memory/test_context_assembler_v2.py], steps: ["Start task state; retrieve bounded pointers; expand selected refs; enforce size budget."], test: "uv run pytest tests/memory/test_context_assembler_v2.py -q", acceptance: "Relevant provenance included; irrelevant fixture excluded.", deps: [A-0703, A-0704]}
- {id: A-0706, epic: E07, goal: "Prove context refresh preserves identity.", inputs: [A-0705, A-0202], outputs: [tests/memory/test_context_refresh_identity.py], steps: ["Build context; discard; rebuild; assert same agent/task ids and relevant refs."], test: "uv run pytest tests/memory/test_context_refresh_identity.py -q", acceptance: "Fresh context does not create new agent.", deps: [A-0705]}
