packets:
- {id: A-1301, epic: E13, goal: "Define staffing decision observation record.", inputs: [A-0901, A-0601], outputs: [src/swarm/contracts/staffing_analytics_v2.py, tests/contracts/test_staffing_analytics_v2.py], steps: ["Record pre-decision state, spawn/reuse/no-spawn choice, expected benefit, actual outcome/resource delta."], test: "uv run pytest tests/contracts/test_staffing_analytics_v2.py -q", acceptance: "No-spawn is a first-class recorded decision.", deps: [A-0901, A-0601]}
- {id: A-1302, epic: E13, goal: "Build staffing benchmark fixture with 1/2/4 worker variants.", inputs: [A-1301, A-0907], outputs: [benchmarks/redesign/staffing_fixture_v2.yaml, tests/evals/test_staffing_fixture_v2.py], steps: ["Use same bounded task/criteria; vary worker count only; record verified outcome and resource use."], test: "uv run pytest tests/evals/test_staffing_fixture_v2.py -q", acceptance: "Fixture isolates worker-count variable and has same success criteria.", deps: [A-1301, A-0907]}
- {id: A-1303, epic: E13, goal: "Build model/effort benchmark fixture.", inputs: [A-0907], outputs: [benchmarks/redesign/model_effort_fixture_v2.yaml, tests/evals/test_model_effort_fixture_v2.py], steps: ["Define same task/permissions/criteria across configurations; record requested/applied model and effort."], test: "uv run pytest tests/evals/test_model_effort_fixture_v2.py -q", acceptance: "Fixture distinguishes model from workflow effort.", deps: [A-0907]}
- {id: A-1304, epic: E13, goal: "Implement conservative resource recommendation from comparable evidence.", inputs: [A-0905, A-0906, A-1302, A-1303], outputs: [src/swarm/evals/resource_recommender_v2.py, tests/evals/test_resource_recommender_v2.py], steps: ["Use only comparable cohorts/controlled records; return recommendation plus evidence count/uncertainty; allow no recommendation."], test: "uv run pytest tests/evals/test_resource_recommender_v2.py -q", acceptance: "Sparse/confounded fixture returns insufficient-evidence rather than false optimum.", deps: [A-0905, A-0906, A-1302, A-1303]}
- {id: A-1305, epic: E13, goal: "Let recruitment consult resource recommendation without making it mandatory.", inputs: [A-0603, A-1304], outputs: [src/swarm/runtime/recruitment_advisor_v2.py, tests/runtime/test_recruitment_advisor_v2.py], steps: ["Return spawn/reuse/no-spawn suggestion and evidence; keep mission envelope authoritative; permit agent to proceed when policy allows."], test: "uv run pytest tests/runtime/test_recruitment_advisor_v2.py -q", acceptance: "Advisor cannot expand resource envelope.", deps: [A-0603, A-1304]}
- {id: A-1306, epic: E13, goal: "Prove system can choose not to spawn.", inputs: [A-1305], outputs: [tests/e2e/test_no_spawn_efficiency_v2.py], steps: ["Use fixture where extra workers add cost without outcome gain; assert advisor suggests no-spawn and mission completes with current agent."], test: "uv run pytest tests/e2e/test_no_spawn_efficiency_v2.py -q", acceptance: "More agents is not hard-coded as improvement.", deps: [A-1305]}

- {id: A-1401, epic: E14, goal: "Add tenant/workspace id to new durable redesign records.", inputs: [A-0201, docs/redesign/reuse/persistence_inventory.yaml], outputs: ["migration_path_key:redesign_tenant_scope from docs/redesign/reuse/path_conventions.yaml"], steps: ["Follow existing tenancy convention; add required scope/index/FKs; include downgrade."], test: "Run migration tests plus tenant fixture migration check.", acceptance: "New redesign records are scope-addressable.", deps: [A-0206, A-0006]}
- {id: A-1402, epic: E14, goal: "Enforce tenant scope in redesign stores.", inputs: [A-1401, A-0202, A-0203, A-0204, A-0205], outputs: [tests/integration/test_redesign_tenant_isolation.py], steps: ["Create same-shaped data in two tenants; query through stores; assert no cross-tenant reads/writes."], test: "uv run pytest tests/integration/test_redesign_tenant_isolation.py -q", acceptance: "Cross-tenant fixture access is denied or empty per existing convention.", deps: [A-1401]}
- {id: A-1403, epic: E14, goal: "Prove secrets never enter artifacts, analytics or inference receipts.", inputs: [A-1202, A-0902], outputs: [tests/regressions/test_redesign_secret_redaction.py], steps: ["Inject recognizable fake secret through connection config; run request; inspect serialized receipts/events/artifacts."], test: "uv run pytest tests/regressions/test_redesign_secret_redaction.py -q", acceptance: "Fake secret absent from every persisted/user-visible fixture output.", deps: [A-1202, A-0902]}
- {id: A-1404, epic: E14, goal: "Prove tool capability denial is enforced below the model.", inputs: [A-0405], outputs: [tests/regressions/test_tool_permission_enforcement_v2.py], steps: ["Create agent output requesting denied side-effect tool; assert authorizer blocks before adapter invocation."], test: "uv run pytest tests/regressions/test_tool_permission_enforcement_v2.py -q", acceptance: "Prompt/model behavior cannot bypass denial.", deps: [A-0405]}
- {id: A-1405, epic: E14, goal: "Prove stop/pause propagates to autonomous descendants.", inputs: [A-0606, A-1103], outputs: [tests/e2e/test_descendant_stop_v2.py], steps: ["Start mission that recruits child; pause/stop parent mission; assert no descendant leases new artifact and state persists."], test: "uv run pytest tests/e2e/test_descendant_stop_v2.py -q", acceptance: "Autonomous recruitment cannot escape mission stop state.", deps: [A-0606, A-1103]}
- {id: A-1406, epic: E14, goal: "Add redesign release verification command.", inputs: [A-1205, A-1306, A-1402, A-1403, A-1404, A-1405, src/swarm/release], outputs: [src/swarm/release/redesign_verify_v2.py, tests/release/test_redesign_verify_v2.py], steps: ["Compose required offline checks; report live-gated checks separately; fail closed on required offline failure."], test: "uv run pytest tests/release/test_redesign_verify_v2.py -q", acceptance: "Offline pass cannot be mislabeled as live proof.", deps: [A-1205, A-1306, A-1402, A-1403, A-1404, A-1405]}
- {id: A-1407, epic: E14, goal: "Create final end-to-end mission acceptance scenario.", inputs: [A-1406], outputs: [tests/e2e/test_redesign_full_mission_v2.py, docs/redesign/evidence/FINAL_ACCEPTANCE_TEMPLATE.md], steps: ["Create goal; plan artifact graph; use mixed inference fakes; use native+MCP tools; recruit; form crew; learn; restart; resume; verify artifacts; collect analytics; stop cleanly."], test: "uv run pytest tests/e2e/test_redesign_full_mission_v2.py -q", acceptance: "Every major redesign subsystem participates and final completion points to evidence.", deps: [A-1406]}
