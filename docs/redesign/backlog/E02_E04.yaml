  inputs: [A-0401, sandbox, docs/redesign/reuse/runtime_inventory.yaml]
  outputs: [src/swarm/capabilities/terminal_tool_v2.py, tests/tools/test_terminal_tool_v2.py]
  steps: [Reuse existing sandbox boundary, define command input/result receipt, enforce timeout/workspace scope.]
  test: "uv run pytest tests/tools/test_terminal_tool_v2.py -q"
  acceptance: "Command runs in sandbox fixture and cannot address forbidden host path fixture."
  deps: [A-0401]
- id: A-0403
  epic: E04
  goal: Register web search/browse capability through ToolRegistry.
  inputs: [A-0401, docs/redesign/reuse/runtime_inventory.yaml]
  outputs: [src/swarm/capabilities/web_tool_v2.py, tests/tools/test_web_tool_v2.py]
  steps: [Wrap existing web capability if present; otherwise define adapter seam and fake; normalize source/provenance receipt.]
  test: "uv run pytest tests/tools/test_web_tool_v2.py -q"
  acceptance: "Agent-facing tool contract is transport-neutral and preserves source provenance."
