- id: A-0404
  epic: E04
  goal: Implement MCP client adapter into ToolRegistry.
  inputs: [A-0401]
  outputs: [src/swarm/extensions/mcp_adapter_v2.py, tests/extensions/test_mcp_adapter_v2.py]
  steps: [Discover MCP tools, map schemas to ToolCapability, invoke selected tool, map result to ToolReceipt.]
  test: "uv run pytest tests/extensions/test_mcp_adapter_v2.py -q"
  acceptance: "Fake MCP server tool is discoverable and invokable through registry."
  deps: [A-0401]
- id: A-0405
  epic: E04
  goal: Enforce tool capability scope before invocation.
  inputs: [A-0401, src/swarm/contracts/mission_v2.py]
  outputs: [src/swarm/capabilities/tool_authorizer_v2.py, tests/tools/test_tool_authorizer_v2.py]
  steps: [Compare requested tool/scope/side-effect against mission capabilities, return allow/deny reason, do not rely on prompt compliance.]
  test: "uv run pytest tests/tools/test_tool_authorizer_v2.py -q"
  acceptance: "Denied fixture never reaches underlying tool invocation."
  deps: [A-0401]
- id: A-0406
  epic: E04
  goal: Prove native and MCP tools share one invocation path.
  inputs: [A-0402, A-0403, A-0404, A-0405]
  outputs: [tests/integration/test_unified_tool_invocation.py]
  steps: [Register native fake and MCP fake, authorize, invoke both through same service, compare normalized receipts.]
  test: "uv run pytest tests/integration/test_unified_tool_invocation.py -q"
  acceptance: "Caller requires no transport-specific branch."
  deps: [A-0402, A-0403, A-0404, A-0405]
