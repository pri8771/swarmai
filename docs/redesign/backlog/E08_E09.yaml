version: 1
epics: [E08, E09]
packets:
- {id: A-0801, epic: E08, goal: "Persist experience from completed attempts.", inputs: [A-0203, src/swarm/contracts/learning_v2.py], outputs: [src/swarm/learning/experience_store_v2.py, tests/learning/test_experience_store_v2.py], steps: ["Create experience from attempt/outcome/evidence refs; query by task family/agent/model."], test: "uv run pytest tests/learning/test_experience_store_v2.py -q", acceptance: "Failed and successful attempts retained.", deps: [A-0203]}
- {id: A-0802, epic: E08, goal: "Create candidate lesson without auto-validation.", inputs: [A-0801], outputs: [src/swarm/learning/lesson_candidate_v2.py, tests/learning/test_lesson_candidate_v2.py], steps: ["Store explanation/lesson/scope/evidence refs/confidence with state=candidate."], test: "uv run pytest tests/learning/test_lesson_candidate_v2.py -q", acceptance: "Candidate cannot self-mark validated.", deps: [A-0801]}
- {id: A-0803, epic: E08, goal: "Validate/reject/inconclusive lesson candidate.", inputs: [A-0802], outputs: [src/swarm/learning/lesson_validator_v2.py, tests/learning/test_lesson_validator_v2.py], steps: ["Check evidence/counterevidence/scope; emit decision with refs."], test: "uv run pytest tests/learning/test_lesson_validator_v2.py -q", acceptance: "Inconclusive fixture remains non-validated.", deps: [A-0802]}
- {id: A-0804, epic: E08, goal: "Publish validated lessons into pointer memory.", inputs: [A-0803, A-0703], outputs: [src/swarm/learning/lesson_memory_bridge.py, tests/learning/test_lesson_memory_bridge.py], steps: ["Publish validated lesson pointer with scope/tags; exclude rejected/inconclusive."], test: "uv run pytest tests/learning/test_lesson_memory_bridge.py -q", acceptance: "Only validated lesson enters normal retrieval.", deps: [A-0803, A-0703]}
- {id: A-0805, epic: E08, goal: "Persist Experimenter challenge/hypothesis state.", inputs: [A-0801], outputs: [src/swarm/learning/experimenter_state_v2.py, tests/learning/test_experimenter_state_v2.py], steps: ["Store challenge/success criteria/hypotheses/attempt refs/status/next action; retain failures."], test: "uv run pytest tests/learning/test_experimenter_state_v2.py -q", acceptance: "Reload contains complete attempt history.", deps: [A-0801]}
- {id: A-0806, epic: E08, goal: "Select Experimenter's next materially useful attempt.", inputs: [A-0804, A-0805], outputs: [src/swarm/learning/experimenter_loop_v2.py, tests/learning/test_experimenter_loop_v2.py], steps: ["Prefer untested/materially changed hypothesis; require reason for identical retry; emit recruitment request for independent hypotheses."], test: "uv run pytest tests/learning/test_experimenter_loop_v2.py -q", acceptance: "Unjustified duplicate retry rejected; independent hypotheses parallelizable.", deps: [A-0804, A-0805]}
- {id: A-0807, epic: E08, goal: "Prove Experimenter restart continuity.", inputs: [A-0806, A-0206], outputs: [tests/recovery/test_experimenter_resume.py], steps: ["Record failed attempt and next hypothesis; restart; resume; assert old evidence remains and next attempt differs."], test: "uv run pytest tests/recovery/test_experimenter_resume.py -q", acceptance: "Restart never resets challenge or erases failures.", deps: [A-0806, A-0206]}

- {id: A-0901, epic: E09, goal: "Define unknown-safe analytics event contract.", inputs: [src/swarm/contracts/execution_v2.py, src/swarm/contracts/tool_v2.py], outputs: [src/swarm/contracts/analytics_v2.py, tests/contracts/test_analytics_v2.py], steps: ["Define task/model/effort/token/latency/cost/tool/collaboration/outcome/evidence dimensions; represent unknown explicitly."], test: "uv run pytest tests/contracts/test_analytics_v2.py -q", acceptance: "Unknown cost/token/version is not converted to zero.", deps: [A-0110]}
- {id: A-0902, epic: E09, goal: "Emit inference analytics from actual receipts.", inputs: [A-0305, A-0901], outputs: [src/swarm/observability/inference_analytics_v2.py, tests/evals/test_inference_analytics_v2.py], steps: ["Map receipt to event; include requested/applied config and retry/fallback attribution."], test: "uv run pytest tests/evals/test_inference_analytics_v2.py -q", acceptance: "Fallback fixture records actual route plus original request.", deps: [A-0305, A-0901]}
- {id: A-0903, epic: E09, goal: "Emit tool and collaboration analytics.", inputs: [A-0406, A-0606, A-0901], outputs: [src/swarm/observability/work_analytics_v2.py, tests/evals/test_work_analytics_v2.py], steps: ["Record tool calls, spawn/reuse, crew membership, attempts, wall time keyed to artifact/agent."], test: "uv run pytest tests/evals/test_work_analytics_v2.py -q", acceptance: "Fixture artifact reconstructs resource/collaboration timeline.", deps: [A-0406, A-0606, A-0901]}
- {id: A-0904, epic: E09, goal: "Join verified artifact outcomes to analytics.", inputs: [A-0902, A-0903, A-0205], outputs: [src/swarm/observability/outcome_join_v2.py, tests/evals/test_outcome_join_v2.py], steps: ["Join only by durable ids; mark verification status/method; keep partial/blocked distinct from failure."], test: "uv run pytest tests/evals/test_outcome_join_v2.py -q", acceptance: "Every reported success points to verification/evidence id.", deps: [A-0902, A-0903, A-0205]}
- {id: A-0905, epic: E09, goal: "Implement cohort query by task/model/effort/tool/personality/team.", inputs: [A-0904], outputs: [src/swarm/evals/cohort_query_v2.py, tests/evals/test_cohort_query_v2.py], steps: ["Filter comparable records; return counts/success/resource summaries; label observational results."], test: "uv run pytest tests/evals/test_cohort_query_v2.py -q", acceptance: "Query never labels raw association causal or best without experiment evidence.", deps: [A-0904]}
- {id: A-0906, epic: E09, goal: "Compute token/resource efficiency metrics.", inputs: [A-0904], outputs: [src/swarm/evals/efficiency_metrics_v2.py, tests/evals/test_efficiency_metrics_v2.py], steps: ["Compute verified-success/resource summaries only when denominators known; preserve unknowns."], test: "uv run pytest tests/evals/test_efficiency_metrics_v2.py -q", acceptance: "Missing token/cost data never becomes fake efficiency score.", deps: [A-0904]}
- {id: A-0907, epic: E09, goal: "Add controlled comparison record for model/effort experiments.", inputs: [A-0901], outputs: [src/swarm/evals/comparison_experiment_v2.py, tests/evals/test_comparison_experiment_v2.py], steps: ["Record matched task fixture, configurations, controls, outcomes and evidence; distinguish experiment from production observation."], test: "uv run pytest tests/evals/test_comparison_experiment_v2.py -q", acceptance: "Experiment record requires comparable task/criteria references.", deps: [A-0901]}
