# A generic, single database configuration.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder only — overridden by migrations/env.py from SWARM_DATABASE_URL (V2A-H6A).
# Do not put a real password here; operational default is empty/unconfigured.
sqlalchemy.url = postgresql+psycopg://UNCONFIGURED:UNCONFIGURED@127.0.0.1:5432/UNCONFIGURED


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
