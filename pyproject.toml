[project]
name = "swarm"
version = "0.1.0"
description = "SwarmAI — elastic multi-provider problem-solving swarm"
readme = "README.md"
authors = [
    { name = "Priyansh Chordia", email = "priyansh.chordia@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<1.18",
    "fastapi>=0.115,<0.142",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<3.4",
    "pydantic>=2.10,<2.14",
    "pydantic-ai[dbos]>=2.46,<2.47",
    "pydantic-settings>=2.6,<2.16",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.32,<0.54",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.4",
    "pytest>=8.3,<9.2",
    "pytest-asyncio>=0.25,<1.5",
    "ruff>=0.9,<0.17",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.4",
    "pytest>=8.3,<9.2",
    "pytest-asyncio>=0.25,<1.5",
    "ruff>=0.9,<0.17",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: requires local PostgreSQL (SWARM_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swarm"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["dbos.*"]
ignore_missing_imports = true
