name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_local:
        description: "Run SWARM_LIVE_LOCAL=1 pytest (loopback fixture / Ollama only)"
        type: boolean
        default: false

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src/swarm
      - name: Install / packaging check
        run: uv run python -c "from pathlib import Path; from swarm.release.install import run_install_check; r=run_install_check(Path('.')); print(r.to_dict()); raise SystemExit(0 if r.ok else 1)"
      - name: Alembic heads
        run: uv run alembic heads
      # Offline-safe unit/contract suites. Live-gated suites are a separate job
      # that reports blocked/skipped honestly rather than implying pass.
      - name: Offline pytest (non-live)
        run: >
          uv run pytest
          tests/contracts
          tests/spikes
          tests/api
          tests/broker
          tests/controller
          tests/chaos
          tests/deployment
          tests/evals
          tests/load
          tests/memory
          tests/mission
          tests/onboarding
          tests/product
          tests/providers
          tests/regressions
          tests/release
          tests/runtime
          tests/selfdev
          tests/tools
          tests/ui
          tests/workers
          tests/workspace
          tests/e2e
          tests/live_fixture
          -q
          --ignore=tests/integration
      - name: Integration pytest (requires SWARM_DATABASE_URL)
        if: ${{ env.SWARM_DATABASE_URL != '' }}
        run: uv run pytest tests/integration -q
      - name: Integration skipped notice
        if: ${{ env.SWARM_DATABASE_URL == '' }}
        run: >
          echo "::notice title=integration-tests-blocked::tests/integration skipped —
          SWARM_DATABASE_URL not configured in this CI environment (honest skip, not a pass)."

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  live-gated:
    runs-on: ubuntu-latest
    # Does not claim live success. Documents that live gates are not executed here.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_live_local != true }}
    steps:
      - uses: actions/checkout@v4
      - name: Live gates not run in default CI
        run: |
          echo "::notice title=live-gates-blocked::Live provider/browser/mission acceptance"
          echo "is intentionally NOT executed in default GitHub Actions CI."
          echo "Reason: zero-spend + authorized-local-only policy; missing live credentials"
          echo "and protected browser profiles in this runner. Live evidence is collected"
          echo "in the authorized local/private environment under V1_4_EXECUTION_CONTRACT."
          echo "status=blocked_not_skipped_green"
          echo "Manual path: workflow_dispatch with run_live_local=true (requires Ollama/secrets)."

  live-local:
    runs-on: ubuntu-latest
    # Manual only. Never turns default PR CI red when Ollama is absent.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_local == true }}
    env:
      SWARM_LIVE_LOCAL: "1"
      SWARM_ALLOW_PAID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Live local pytest (zero-spend loopback)
        run: |
          if ! curl -fsS -m 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "::notice title=live-local-ollama-absent::Ollama loopback unavailable;"
            echo "running fixture live_local suite only (no paid/cloud routes)."
          fi
          uv run pytest -m live_local -q --tb=short
          echo "::notice title=live-local-ran::SWARM_LIVE_LOCAL=1 suite executed under SWARM_ALLOW_PAID=false."
