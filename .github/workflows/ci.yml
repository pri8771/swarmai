name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src/swarm
      - name: Install / packaging check
        run: uv run python -c "from pathlib import Path; from swarm.release.install import run_install_check; r=run_install_check(Path('.')); print(r.to_dict()); raise SystemExit(0 if r.ok else 1)"
      - name: Alembic heads
        run: uv run alembic heads
      # Offline-safe unit/contract suites. Live-gated suites are a separate job
      # that reports blocked/skipped honestly rather than implying pass.
      # Integration DB suites run in the dedicated `integration` job with
      # ephemeral PostgreSQL — a missing DB notice is not counted as a pass (R7).
      - name: Offline pytest (non-live)
        run: >
          uv run pytest
          tests/contracts
          tests/spikes
          tests/api
          tests/broker
          tests/controller
          tests/chaos
          tests/deployment
          tests/evals
          tests/extensions
          tests/foundation
          tests/goals
          tests/knowledge
          tests/load
          tests/memory
          tests/mission
          tests/objectives
          tests/onboarding
          tests/product
          tests/providers
          tests/recovery
          tests/regressions
          tests/release
          tests/runtime
          tests/selfdev
          tests/tools
          tests/ui
          tests/workers
          tests/workspace
          tests/e2e
          tests/acceptance
          -q
          --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm -d swarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SWARM_DATABASE_URL: postgresql+psycopg://swarm:swarm@127.0.0.1:5432/swarm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: PostgreSQL integration pytest
        run: uv run pytest tests/integration -q -m integration

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  live-gated:
    runs-on: ubuntu-latest
    # Does not claim live success. Documents that live gates are not executed here.
    steps:
      - uses: actions/checkout@v4
      - name: Live gates not run in default CI
        run: |
          echo "::notice title=live-gates-blocked::Live provider/browser/mission acceptance"
          echo "is intentionally NOT executed in default GitHub Actions CI."
          echo "Reason: zero-spend + authorized-local-only policy; missing live credentials"
          echo "and protected browser profiles in this runner. Live evidence is collected"
          echo "in the authorized local/private environment under V1_4_EXECUTION_CONTRACT."
          echo "status=blocked_not_skipped_green"
