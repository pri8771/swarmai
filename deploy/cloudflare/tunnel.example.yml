# EXAMPLE Cloudflare Tunnel config — REFERENCE ONLY (see docs/reference/CLOUDFLARE-TUNNEL.md).
# Do not enable without origin cert + Access policy.
# Copy to tunnel.runtime.yml only on the server host after credentials exist.
# This file alone must never publish an unauthenticated service.
# Hostname below is a placeholder — replace in runtime config, not in git.

tunnel: REPLACE_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials/tunnel.json

ingress:
  # Operator UI/API — protect with Access (configure in dashboard).
  - hostname: coordinator.example.test
    path: /health/*
    service: http://api:8765
  - hostname: coordinator.example.test
    service: http://api:8765
    originRequest:
      noHappyEyeballs: true
  - service: http_status:404
