# SwarmAI standalone — local only, non-root, no public DB/inference admin.
# V2A-H6A: no fixed DB password. Copy .env.example -> .env and run
# scripts/generate_compose_env.py (or set SWARM_POSTGRES_PASSWORD / SWARM_DATABASE_URL).
services:
  api:
    image: swarm-ai:local
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SWARM_DATABASE_URL: ${SWARM_DATABASE_URL:?SWARM_DATABASE_URL must be set from generated/operator secret}
      SWARM_BIND_HOST: "127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
  db:
    image: postgres:16-alpine
    user: "999:999"
    environment:
      POSTGRES_USER: ${SWARM_POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${SWARM_POSTGRES_PASSWORD:?SWARM_POSTGRES_PASSWORD must be set from generated/operator secret}
      POSTGRES_DB: ${SWARM_POSTGRES_DB:-swarm}
    # No host port publish — internal network only.
    networks:
      - internal
    volumes:
      - swarm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  internal:
    internal: true

volumes:
  swarm_pg:
