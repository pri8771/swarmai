# Mac worker connector — outbound to SwarmAI server only.
# No Postgres. No public inbound ports.
# One-shot TH-03: enroll, complete mac_local scoped mission, exit.
# Server must remain up after this container stops.
name: swarm-mac-connector

services:
  connector:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: swarm-ai:local
    # Run as swarm; entrypoint overridden for one-shot connector.
    user: "1000:1000"
    env_file:
      - ../env/mac-connector.env
    environment:
      SWARM_ALLOW_PAID: "false"
      SWARM_ROLE: mac_connector
      # From container → host-published server port (Docker Desktop).
      SWARM_SERVER_URL: ${SWARM_SERVER_URL:-http://host.docker.internal:18766}
      SWARM_REPO_ROOT: "/work"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mac-local fixtures + evidence bind-mounted from the Mac checkout.
      - ../..:/work:rw
    working_dir: /work
    entrypoint: ["/app/.venv/bin/python"]
    command: ["scripts/th03_mac_connector.py"]
    networks:
      - swarm_connector
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    stop_grace_period: 15s
    restart: "no"

networks:
  swarm_connector:
    driver: bridge
