# Hybrid — local API + optional private model endpoint (never public admin).
services:
  api:
    image: swarm-ai:local
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SWARM_DATABASE_URL: postgresql+psycopg://swarm:swarm@db:5432/swarm
      SWARM_PRIVATE_MODEL_URL: http://models:11434/v1
    depends_on:
      - db
    networks:
      - internal
  db:
    image: postgres:16-alpine
    user: "999:999"
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    networks:
      - internal
    volumes:
      - swarm_pg:/var/lib/postgresql/data
  models:
    image: ollama/ollama:latest
    user: "1000:1000"
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  swarm_pg:
